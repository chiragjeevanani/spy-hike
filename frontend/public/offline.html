<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - Unplug & Connect with Nature | Spy Hike</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0b132b 0%, #1c2541 50%, #0b132b 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      overflow-x: hidden;
      position: relative;
    }

    /* Floating stars background */
    .sky {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      opacity: 0.6;
      animation: twinkle var(--duration, 3s) infinite ease-in-out;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 0.9; transform: scale(1.2); }
    }

    /* Main Container */
    .container {
      max-width: 650px;
      width: 100%;
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 1.5rem;
      padding: 2.5rem 2rem;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      z-index: 10;
      position: relative;
    }

    /* Camping Scene Illustration */
    .camp-scene {
      position: relative;
      width: 100%;
      height: 190px;
      margin: 0 auto 1.5rem auto;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    /* Mountains silhouette in background */
    .mountains {
      position: absolute;
      bottom: 25px;
      width: 100%;
      height: 90px;
      display: flex;
      justify-content: center;
      opacity: 0.35;
    }

    .mountain {
      width: 0;
      height: 0;
      border-left: 90px solid transparent;
      border-right: 90px solid transparent;
      border-bottom: 90px solid #38bdf8;
    }

    .mountain.m2 {
      border-left-width: 120px;
      border-right-width: 120px;
      border-bottom-width: 110px;
      margin-left: -50px;
      border-bottom-color: #6366f1;
    }

    /* Campfire animation */
    .campfire-wrapper {
      position: relative;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .fire {
      width: 30px;
      height: 45px;
      position: relative;
    }

    .flame {
      position: absolute;
      bottom: 0;
      border-radius: 50% 50% 20% 20%;
      transform-origin: center bottom;
      animation: flicker 0.8s infinite alternate ease-in-out;
    }

    .flame-1 {
      width: 30px;
      height: 45px;
      background: #f97316;
      left: 0;
    }

    .flame-2 {
      width: 20px;
      height: 32px;
      background: #eab308;
      left: 5px;
      animation-delay: 0.2s;
    }

    .flame-3 {
      width: 12px;
      height: 20px;
      background: #ffffff;
      left: 9px;
      animation-delay: 0.4s;
    }

    @keyframes flicker {
      0% { transform: scale(1) rotate(-2deg); }
      100% { transform: scale(1.12) rotate(2deg); filter: drop-shadow(0 -5px 12px #f97316); }
    }

    .logs {
      width: 44px;
      height: 10px;
      background: #78350f;
      border-radius: 4px;
      margin-top: -4px;
      position: relative;
      z-index: 6;
    }

    /* Animated Hikers / Friends Sitting & Chatting around Campfire */
    .friends-group {
      position: absolute;
      bottom: 12px;
      width: 100%;
      display: flex;
      justify-content: space-around;
      align-items: flex-end;
      padding: 0 10%;
      z-index: 4;
    }

    .person {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .person .head {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #38bdf8;
      margin-bottom: 2px;
    }

    .person .body {
      width: 32px;
      height: 38px;
      background: #0284c7;
      border-radius: 12px 12px 0 0;
      position: relative;
    }

    /* Person 1 Chatting animation */
    .person.p1 .head { background: #fb7185; }
    .person.p1 .body { background: #e11d48; }
    .person.p1 { animation: talkLeft 3s infinite ease-in-out; }

    /* Person 2 Laughing/Nodding animation */
    .person.p2 .head { background: #4ade80; }
    .person.p2 .body { background: #16a34a; }
    .person.p2 { animation: talkRight 3.5s infinite ease-in-out 0.5s; }

    /* Person 3 Stargazing animation */
    .person.p3 .head { background: #c084fc; }
    .person.p3 .body { background: #9333ea; }
    .person.p3 { animation: talkLeft 4s infinite ease-in-out 1s; }

    @keyframes talkLeft {
      0%, 100% { transform: rotate(0deg) translateY(0); }
      50% { transform: rotate(4deg) translateY(-3px); }
    }

    @keyframes talkRight {
      0%, 100% { transform: rotate(0deg) translateY(0); }
      50% { transform: rotate(-5deg) translateY(-2px); }
    }

    /* Speech Bubble Animation */
    .speech-bubble {
      position: absolute;
      top: -32px;
      background: #ffffff;
      color: #0f172a;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.72rem;
      font-weight: 700;
      white-space: nowrap;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      animation: popBubble 6s infinite ease-in-out;
      opacity: 0;
    }

    .speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 4px 4px 0;
      border-style: solid;
      border-color: #ffffff transparent;
    }

    .p1 .speech-bubble { animation-delay: 0.5s; }
    .p2 .speech-bubble { animation-delay: 2.5s; }
    .p3 .speech-bubble { animation-delay: 4.5s; }

    @keyframes popBubble {
      0%, 25%, 100% { opacity: 0; transform: translateY(4px) scale(0.9); }
      5%, 20% { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Typography & Content */
    .tagline {
      display: inline-block;
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 0.35rem 1rem;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 0.75rem;
      line-height: 1.3;
    }

    .quote-box {
      background: rgba(15, 23, 42, 0.5);
      border-left: 3px solid #38bdf8;
      border-radius: 0 0.75rem 0.75rem 0;
      padding: 1rem 1.25rem;
      margin: 1.25rem 0 1.75rem 0;
      text-align: left;
    }

    .quote-text {
      color: #e2e8f0;
      font-size: 0.95rem;
      font-style: italic;
      line-height: 1.6;
    }

    .quote-author {
      color: #38bdf8;
      font-size: 0.8rem;
      font-weight: 600;
      margin-top: 0.5rem;
      text-align: right;
    }

    /* Buttons & Badge */
    .actions {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      align-items: center;
    }

    .btn-retry {
      background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
      color: white;
      border: none;
      padding: 0.85rem 2rem;
      font-size: 0.95rem;
      font-weight: 700;
      border-radius: 0.75rem;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-retry:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.6);
    }

    .btn-retry:active {
      transform: translateY(0);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.8rem;
      color: #94a3b8;
      margin-top: 1rem;
    }

    .ping-dot {
      position: relative;
      width: 8px;
      height: 8px;
    }

    .ping-dot span {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background-color: #ef4444;
    }

    .ping-dot .pulse {
      animation: ping 1.5s cubic-bezier(0, 0, 0.2, 1) infinite;
      opacity: 0.75;
    }

    @keyframes ping {
      75%, 100% { transform: scale(2.5); opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- Starry Sky Background -->
  <div class="sky">
    <div class="star" style="top: 15%; left: 20%; width: 3px; height: 3px; --duration: 2.5s;"></div>
    <div class="star" style="top: 30%; left: 75%; width: 2px; height: 2px; --duration: 4s;"></div>
    <div class="star" style="top: 60%; left: 10%; width: 3px; height: 3px; --duration: 3.2s;"></div>
    <div class="star" style="top: 75%; left: 85%; width: 2px; height: 2px; --duration: 2.8s;"></div>
    <div class="star" style="top: 10%; left: 60%; width: 4px; height: 4px; --duration: 5s;"></div>
  </div>

  <div class="container">
    <span class="tagline">🌲 You Are Off The Grid</span>

    <!-- Animated Camping & Chatting Group Scene -->
    <div class="camp-scene">
      <div class="mountains">
        <div class="mountain"></div>
        <div class="mountain m2"></div>
      </div>

      <div class="friends-group">
        <!-- Person 1 -->
        <div class="person p1">
          <div class="speech-bubble">Great stories! ☕</div>
          <div class="head"></div>
          <div class="body"></div>
        </div>

        <!-- Campfire -->
        <div class="campfire-wrapper">
          <div class="fire">
            <div class="flame flame-1"></div>
            <div class="flame flame-2"></div>
            <div class="flame flame-3"></div>
          </div>
          <div class="logs"></div>
        </div>

        <!-- Person 2 -->
        <div class="person p2">
          <div class="speech-bubble">Look at the stars! ✨</div>
          <div class="head"></div>
          <div class="body"></div>
        </div>

        <!-- Person 3 -->
        <div class="person p3">
          <div class="speech-bubble">Unplug & Enjoy 🏔️</div>
          <div class="head"></div>
          <div class="body"></div>
        </div>
      </div>
    </div>

    <h1>No Internet? No Problem!</h1>

    <div class="quote-box">
      <p class="quote-text" id="quote-text">
        "In every walk with nature one receives far more than he seeks. Take this moment to disconnect from the screen and talk with those around you."
      </p>
      <p class="quote-author" id="quote-author">— John Muir</p>
    </div>

    <div class="actions">
      <button class="btn-retry" onclick="checkConnection()">
        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
        </svg>
        Check Connection
      </button>

      <div class="status-badge">
        <div class="ping-dot">
          <span class="pulse"></span>
          <span></span>
        </div>
        <span id="connection-status">Searching for signal...</span>
      </div>
    </div>
  </div>

  <script>
    const quotes = [
      { text: "In every walk with nature one receives far more than he seeks. Take this moment to disconnect from the screen and connect with real life.", author: "— John Muir" },
      { text: "Look deep into nature, and then you will understand everything better.", author: "— Albert Einstein" },
      { text: "The best conversations happen around a campfire when the Wi-Fi signal drops to zero.", author: "— Spy Hike Wanderer" },
      { text: "Disconnect to reconnect. The wilderness is calling while your internet is taking a break.", author: "— Outdoor Wisdom" }
    ];

    // Pick random nature quote on load
    const randomQuote = quotes[Math.floor(Math.random() * quotes.length)];
    document.getElementById('quote-text').textContent = `"${randomQuote.text}"`;
    document.getElementById('quote-author').textContent = randomQuote.author;

    function checkConnection() {
      const statusText = document.getElementById('connection-status');
      statusText.textContent = 'Testing connection...';
      if (navigator.onLine) {
        statusText.textContent = 'Connected! Reloading app...';
        setTimeout(() => {
          window.location.href = '/';
        }, 800);
      } else {
        setTimeout(() => {
          statusText.textContent = 'Still offline. Enjoy the campfire conversation!';
        }, 1000);
      }
    }

    window.addEventListener('online', () => {
      document.getElementById('connection-status').textContent = 'Back online! Reloading...';
      setTimeout(() => { window.location.href = '/'; }, 1000);
    });

    window.addEventListener('offline', () => {
      document.getElementById('connection-status').textContent = 'Offline. Enjoy the nature!';
    });
  </script>
</body>
</html>
