name: Repository security scan
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source without stored credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Test the detector
        run: python3 -m unittest discover -s scripts -p 'test_security_scan.py'
      - name: Inspect repository without executing application code
        run: python3 scripts/security_scan.py
